<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buddie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="app" id="app">
    <aside class="sessions" id="sessions" aria-label="Saved chats">
      <button class="primary" id="newChat" type="button">New chat</button>
      <ul id="sessionList"></ul>
      <p class="hint">Chats are saved in this browser only.</p>
    </aside>

    <main>
      <header class="bar">
        <button class="ghost" id="toggleSessions" type="button" aria-controls="sessions" aria-expanded="false">Chats</button>
        <h1>Buddie</h1>
        <label>Persona
          <select id="persona"></select>
        </label>
        <label>Voice
          <select id="voice"></select>
        </label>
        <button class="ghost" id="toggleTranscript" type="button" aria-pressed="false">Show transcript</button>
        <button class="ghost" id="export" type="button">Download transcript (.md)</button>
      </header>

      <section class="stage" id="stage" data-state="idle">
        <canvas id="wave" aria-hidden="true"></canvas>
        <p id="status" role="status" aria-live="polite">Press start, then just talk. Buddie replies when you pause.</p>
        <button class="mic" id="mic" type="button" data-mode="idle" aria-label="Start listening" title="Start listening">
          <svg class="icon-mic" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
          <svg class="icon-stop" viewBox="0 0 24 24" width="26" height="26" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
      </section>

      <section class="log" id="log" aria-live="polite" aria-label="Conversation"></section>

      <form class="composer" id="textForm" autocomplete="off">
        <input id="textInput" type="text" placeholder="Prefer typing? Write a message" aria-label="Message">
        <button class="primary" type="submit">Send</button>
      </form>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.wasm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.29/dist/bundle.min.js"></script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
